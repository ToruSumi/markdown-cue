<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background with rounded corners -->
  <rect width="128" height="128" rx="20" ry="20" fill="#1e2a3a"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#161e2b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" ry="20" fill="url(#bg-grad)"/>

  <!-- "M" letter — Markdown symbol, centered-left -->
  <text
    x="22"
    y="82"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="62"
    fill="#e0e8f0"
    letter-spacing="-2"
  >M</text>

  <!-- Semicolon ";" trigger character, accent color, bottom-right -->
  <text
    x="82"
    y="88"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="58"
    fill="url(#accent-grad)"
  >;</text>

  <!-- Small underline accent bar beneath "M" -->
  <rect x="22" y="90" width="42" height="4" rx="2" fill="#4fc3f7" opacity="0.6"/>
</svg>
